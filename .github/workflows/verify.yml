name: Verify

# Supply-chain rule: pin actions to full commit SHAs and retain the release tag
# in a comment so updates remain reviewable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: Build, verify, and drive GoLand
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth

      - name: Install checksum-pinned upstream Hunk
        env:
          HUNK_VERSION: '0.20.0'
          # Published both in the v0.20.0 SHA256SUMS asset and GitHub's release metadata.
          HUNK_LINUX_X64_SHA256: 3c1a36767a77675133a25ea7a7fded4c11788ce923407f6bf3608f20c06cf0bb
        run: |
          archive_name=hunkdiff-linux-x64.tar.gz
          archive="$RUNNER_TEMP/$archive_name"
          extract_dir="$RUNNER_TEMP/hunk-$HUNK_VERSION"
          release_url="https://github.com/modem-dev/hunk/releases/download/v$HUNK_VERSION/$archive_name"

          curl \
            --proto '=https' \
            --proto-redir '=https' \
            --fail \
            --silent \
            --show-error \
            --location \
            --output "$archive" \
            "$release_url"
          printf '%s  %s\n' "$HUNK_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict

          mkdir -p "$extract_dir" "$HOME/.hunk/bin"
          tar -xzf "$archive" -C "$extract_dir"
          payload="$extract_dir/hunkdiff-linux-x64"
          test -f "$payload/hunk"
          test -d "$payload/skills"
          install -m 0755 "$payload/hunk" "$HOME/.hunk/bin/hunk"
          cp -R "$payload/skills" "$HOME/.hunk/skills"
          if [[ -f "$payload/metadata.json" ]]; then
            install -m 0644 "$payload/metadata.json" "$HOME/.hunk/metadata.json"
          fi
          installed_version="$("$HOME/.hunk/bin/hunk" --version)"
          if [[ "$installed_version" != "$HUNK_VERSION" ]]; then
            echo "Expected Hunk $HUNK_VERSION, got $installed_version" >&2
            exit 1
          fi
          echo "Installed checksum-pinned Hunk $installed_version"

      - name: Build, test, and verify plugin compatibility
        run: ./gradlew test buildPlugin verifyPlugin --console=plain --no-daemon

      - name: Drive GoLand in Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: ./scripts/run-ui-tests xvfb

      - name: Verify unmodified upstream Hunk end to end
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          ./scripts/run-ui-tests xvfb realHunkE2e
          -PhunkExecutable="$HOME/.hunk/bin/hunk"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hunk-goland-verification-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/reports/
            build/test-results/
            out/ide-tests/tests/**/reports/
            out/ide-tests/tests/**/log/idea.log
            out/ide-tests/tests/**/log/jvm-crash/
            out/ide-tests/tests/**/jbrDiagnostic/

      - name: Upload installable plugin
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hunk-goland-plugin-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: build/distributions/*.zip
