name: Verification pipeline

on:
  workflow_call:
    inputs:
      release-tag:
        description: Optional release tag; must match the embedded plugin version
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plugin:
    name: Build, verify, and drive GoLand
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check release identity and start evidence window
        id: versions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python3 scripts/ci.py metadata --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "HUNK_VERIFICATION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

      - name: Restore exact-version IDE downloads
        id: ide-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ide-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.ide-version }}-${{ hashFiles('build.gradle.kts', 'gradle.properties', 'gradle/verification-metadata.xml') }}
          path: |
            out/ide-tests/cache
            .intellijPlatform/productReleases

      - name: Install display and documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth pandoc

      - name: Lint workflows and test publication guards
        run: |
          bash scripts/lint-workflows
          python3 -m unittest discover -s scripts/tests -v

      - name: Install checksum-pinned upstream Hunk
        run: bash scripts/install-ci-hunk

      - name: Build, test, and verify plugin compatibility
        run: ./gradlew test buildPlugin verifyPlugin --no-build-cache --console=plain --no-daemon

      - name: Drive GoLand in Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: ./scripts/run-ui-tests xvfb integrationTest --rerun-tasks --no-build-cache

      - name: Verify native Hunk and same-profile restart
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          ./scripts/run-ui-tests xvfb realHunkE2e --rerun-tasks --no-build-cache
          -PhunkExecutable="$HOME/.hunk/bin/hunk"

      - name: Generate living docs and verified release assets
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python3 scripts/build-site.py --since "$HUNK_VERIFICATION_STARTED_AT" --refresh
          python3 scripts/ci.py package --since "$HUNK_VERIFICATION_STARTED_AT" --tag "$RELEASE_TAG"

      - name: Save IDE downloads after successful trusted run
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.ide-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.ide-cache.outputs.cache-primary-key }}
          path: |
            out/ide-tests/cache
            .intellijPlatform/productReleases

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hunk-goland-verification-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/reports/
            build/test-results/
            out/ide-tests/tests/**/reports/
            out/ide-tests/tests/**/log/idea.log
            out/ide-tests/tests/**/log/jvm-crash/
            out/ide-tests/tests/**/jbrDiagnostic/

      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hunk-goland-release
          retention-days: 14
          if-no-files-found: error
          path: build/release/*

      - name: Upload documentation preview
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hunk-goland-docs
          retention-days: 14
          if-no-files-found: error
          path: build/site/

      - name: Upload Pages site on the default branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site/
