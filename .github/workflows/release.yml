name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    uses: ./.github/workflows/verification.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    needs: verification
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download exact verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hunk-goland-release
          path: build/release

      - name: Verify assets against tag and source commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/ci.py verify-package --tag "$RELEASE_TAG"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true || {
              echo 'Refusing to overwrite a published release' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Hunk Session $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          fi
          gh release upload "$RELEASE_TAG" build/release/* --clobber
